[package]
name = "MRMhub-integrator"
version = "0.9.9"
edition = "2024"
authors = ["Guo Shou Teo (National University of Singapore)"]
description = "INTEGRATOR — automated peak detection and integration for targeted MRM mass spectrometry (part of MRMhub)."
repository = "https://github.com/SLINGhub/MRMhub"

# The executable is named "MRMhub" (not the package name) to match the
# distribution layout and the release workflow.
[[bin]]
name = "MRMhub"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
csv = "1.4.0"
flate2 = "1.1.9"
glob = "0.3.3"
quick-xml = "0.41.0"
rayon = "1.12.0"
regex = "1.13.1"
toml = "1.1.3"
yansi = "1.0.1"

# Windows-only: embed a VERSIONINFO resource (company/description/version) into
# the .exe. This is a no-op on macOS/Linux, so it adds no native deps there.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
