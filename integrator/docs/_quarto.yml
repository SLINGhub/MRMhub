project:
  type: website
  output-dir: _site
  # source/ holds raw source text (e.g. description.md) that feeds the manual
  # pages — render only the .qmd pages so it is not published as an orphan page.
  render:
    - "*.qmd"

website:
  title: "MRMhub · INTEGRATOR"
  page-navigation: true
  navbar:
    background: "#2C3E50"   # brand navy title bar (shared across all three sites)
    foreground: "#ffffff"
    left:
      - text: Home
        href: index.qmd
      - text: Quick Start
        href: quickstart.qmd
      - text: Manual
        menu:
          - text: Download & Setup
            href: setup.qmd
          - text: Input Files
            href: input-files.qmd
          - text: Running INTEGRATOR
            href: running.qmd
          - text: Algorithm
            href: algorithm.qmd
          - text: MRMhub-viz Visualizer
            href: viz.qmd
          - text: Sharing Results
            href: sharing.qmd
          - text: "---"
          - text: Vendor → mzML (MSConvert)
            href: msconvert.qmd
    right:
      - text: "← MRMhub home"
        href: https://slinghub.github.io/MRMhub/
      - text: "QUANT (R package) ↗"
        href: https://slinghub.github.io/MRMhub/quant/
      - icon: github
        href: https://github.com/SLINGhub/MRMhub
        aria-label: GitHub
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - text: Overview
        href: index.qmd
      - text: Quick Start
        href: quickstart.qmd
      - section: Manual
        contents:
          - text: Download & Setup
            href: setup.qmd
          - text: Input Files
            href: input-files.qmd
          - text: Running INTEGRATOR
            href: running.qmd
          - text: Algorithm
            href: algorithm.qmd
          - text: MRMhub-viz Visualizer
            href: viz.qmd
          - text: Sharing Results
            href: sharing.qmd
          - text: Vendor → mzML (MSConvert)
            href: msconvert.qmd

format:
  html:
    # `brand` after `cosmo` so _brand.yml (steel-blue primary) overrides cosmo's
    # default blue; navy navbar is set above via website.navbar.background.
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
