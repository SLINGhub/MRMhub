<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" style="width: 100%; height: auto; font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;" role="img" aria-label="MRMhub processing overview: four pipeline stages — Peak Integration (Retention time alignment, Peak identification/selection, Peak border refinement, Integration, Reporting), Quantitation (ISTD normalization, Isotopic correction, Calibration curves, Quantification, Drift and batch correction), Quality Control (Data integrity, Feature annotation, Outlier detection, Runtime effects, Processing efficacy), and Reporting (Feature filtering, Dataset export, QC reporting, Process reporting, FAIR data sharing). Peak Integration is performed by MRMhub-INTEGRATOR; the remaining three stages by MRMhub-QUANT.">
