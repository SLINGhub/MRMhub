<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRMhub</title>
    <style>
      :root { font-family: sans-serif; background: lightgray; }
      #stick_top { top: 0; left: 0; background: lightgray; position: sticky; z-index: 1; }
      .inputs2 { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      input, select { font-size: 1em; }
      input[type="button"] { cursor: pointer; }
      select { width: min(600px, 80vw); }
      .con { display: flex; flex-wrap: wrap; gap: 2px; }
      #data_status { margin: 0 0 8px; font-size: 0.9em; overflow-wrap: anywhere; }
      .error { color: #9e1515; }
      .chart-slot { flex: 0 0 auto; contain: layout paint style; background: white; border-radius: 8px; }
      .chart-slot svg { display: block; }
    </style>
    <script src="d3.v7.min.js"></script>
    <script type="module">
      import("./index.js").catch((error) => {
        const status = document.getElementById("data_status");
        status.textContent = `Unable to start MRMhub: ${error.message || String(error)}`;
        status.classList.add("error");
      });
    </script>
  </head>
  <body>
    <div id="stick_top">
      <p id="data_status" role="status" aria-live="polite">Loading data…</p>
      <div class="inputs2">
        <div>
          <select id="trans_sel" size="5" aria-label="Transition or reference" disabled></select>
          <input type="button" value="↻" id="refreshb" aria-label="Refresh data" disabled />
        </div>
        <div>
          <input type="number" id="c_width" aria-label="Chart width" min="200" max="9999" step="20" value="400" />px ×
          <input type="number" id="c_height" aria-label="Chart height" min="80" max="9999" step="20" value="120" />px
        </div>
      </div>
      <br />
      <div class="inputs2">
        <b id="sel_analyte"></b>
        <div id="row2"></div>
      </div>
      <hr />
    </div>
    <main class="con">
      <div class="con" id="qc"></div>
      <div class="con" id="container"></div>
    </main>
  </body>
</html>
