<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRMhub</title>
    <style type="text/css">
      :root {
        font-family: sans-serif;
        background: lightgray;
      }
      #stick_top {
        top: 0;
        left: 0;
        background: lightgray;
        position: sticky;
      }
      .inputs2 {
        display: flex;
        justify-content: space-between;
        //gap: 100px;
      }
      input {
        font-size: 1em;
        cursor: pointer;
      }
      input:active {
        transform: scale(0.9);
      }
      select {
        font-size: 1em;
        width: 600px;
      }
      .con {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }
    </style>
    <script src="d3.v7.min.js"></script>
    <script type="module" src="index.js"></script>
    <script type="module">
      // Show the app version in the window title (no-op outside Tauri).
      window.__TAURI__?.app
        ?.getVersion?.()
        .then((v) => {
          document.title = `MRMhub-viz ${v}`;
        })
        .catch(() => {});
    </script>
  </head>
  <body>
    <!--
    <input type="button" value="Reload transition list" id="reload" />
    <br />
    -->
    <div id="stick_top">
      <div class="inputs2">
        <div>
          <select id="trans_sel" size="5"></select>
          <input type="button" value="↻" id="refreshb" />
        </div>
        <div>
          <!-- chromatogram dimensions: -->
          <input
            type="number"
            id="c_width"
            min="200"
            max="9999"
            step="20"
            value="400"
          />px ×
          <input
            type="number"
            id="c_height"
            min="80"
            max="9999"
            step="20"
            value="120"
          />px
        </div>
      </div>
      <br />
      <div class="inputs2">
        <b id="sel_analyte"></b>
        <!--
        <div>
          Jump to:
          <select id="sample_loc"></select>
        </div>
        -->
        <div id="row2"></div>
      </div>
      <hr />
    </div>
    <main class="con">
      <div class="con" id="qc"></div>
      <div class="con" id="container"></div>
    </main>
    <!--
    <footer>MRMhub-I, 2025-</footer>
    -->
  </body>
</html>
