project:
  type: website
  output-dir: _site

website:
  title: "MRMhub"
  navbar:
    background: "#2d5c80"   # header/menu bar colour (shared across all three sites)
    foreground: "#ffffff"
    left:
      - text: Home
        href: index.qmd
      - text: Demo
        href: get-started.qmd
      - text: "INTEGRATOR ↗"
        href: https://slinghub.github.io/MRMhub/integrator/
      - text: "QUANT (R package) ↗"
        href: https://slinghub.github.io/MRMhub/quant/
    right:
      - icon: github
        href: https://github.com/SLINGhub/MRMhub
        aria-label: GitHub

format:
  html:
    # `brand` after `cosmo` so _brand.yml (steel-blue primary) overrides cosmo's
    # default blue; navy navbar is set above via website.navbar.background.
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
