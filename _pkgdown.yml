  - ["articles/tutorial-13-intro-to-r-quarto-mrmhub.html", "articles/tutorial-02-getting-started-mrmhub.html"]
  - ["articles/tutorial-02-basic-workflow.html", "articles/tutorial-02-getting-started-mrmhub.html"]
  - ["articles/tutorial-00-first-analysis.html", "articles/tutorial-02-getting-started-mrmhub.html"]
reference:
- text: QUANT Reference
- title: Getting started
  description: |
    Functions to validate your R environment and explore the MRMhub workflow interactively.
  contents:
  - check_setup
  - build_workflow
  - generate_workflow_qmd
- title: QUANT R package reference
  description: |
    Functions to create, access and query MRMhubExperiment objects, which are the central data object in the MRMhub workflow.
  contents:
  - MRMhubExperiment
  - MRMhubExperiment-class
  - $,MRMhubExperiment-method
  - mrmhub_status
  - set_analysis_order
  - get_batch_boundaries
  - data_sum_features
  - exclude_analyses
  - exclude_features
  - get_analyticaldata
  - set_intensity_var
  - get_analysis_count
  - get_analyis_start
  - get_analyis_end
  - get_analysis_breaks
  - get_analysis_duration
  - get_runtime_median
  - get_feature_count
  - get_featurelist
- title: Analysis data import
  description: |
    Functions to import analytical data from different sources into MRMhubExperiment objects.
    Additionally, the file parser function used internally by these import functions are available
    for direct use, i.e. to import different analytical data into data frames.
  contents:
  - import_data_mrmhub
  - import_data_masshunter
  - import_data_skyline
  - import_data_csv_wide
  - import_data_csv_long
  - import_data_mztab
  - parse_mrmhub_result
  - parse_masshunter_csv
  - parse_skyline_result
  - parse_plain_wide_csv
  - parse_plain_long_csv
  - import_data_csv
- title: Metadata import
  description: |
    Functions to import metadata describing the analyses (samples), features (analytes), internal standards
    and other relevant information from the MRMhub Excel template or CSV files.
  contents:
  - import_metadata_analyses
  - import_metadata_features
  - import_metadata_istds
  - import_metadata_responsecurves
  - import_metadata_qcconcentrations
  - import_metadata_msorganiser
  - import_metadata_from_data
  - save_metadata_templates
  - save_metadata_msorganiser_template
  - add_metadata
- title: Isotope correction
  description: |
    Functions to perform type II isotopic interference correction
  contents:
  - calc_isotopic_interferences
  - correct_isotopic_interferences
  - correct_custom_interferences
  - correct_interference_manual
  - summarize_interferences
  - licar_pattern_choices
- title: External Calibration
  description: |
    Function to plot and analyze external calibration curves
  contents:
  - quantify_by_calibration
  - plot_calibrationcurves
  - calc_calibration_results
  - get_calibration_metrics
  - get_qc_bias_variability
- title: Normalization, Quantification
  description: |
    Functions for normalization by internal standards and sample amounts, to calculate analyte concentrations based
    on internal standards amounts or external calibration curves. Function to for absolute or relative
    calibration using a reference sample.
  contents:
  - normalize_by_istd
  - quantify_by_istd
  - calibrate_by_reference
  example:
    run: no
- title: Drift/Batch Correction
  description: |
    Function for drift and batch correction correction
  contents:
  - correct_drift_gaussiankernel
  - correct_drift_cubicspline
  - correct_drift_loess
  - correct_drift_gam
  - correct_batch_centering
  - correct_batch_combat
  - correct_batch_serrf
- title: Quality Control and Filtering
  description: |
    Functions to calculate feature QC metrics and apply QC filtering, and vizualize the filtering results.
  contents:
  - calc_qc_metrics
  - filter_features_qc
  - detect_outlier_pca
  - plot_qc_summary_byclass
  - plot_qc_summary_overall
  - plot_abundanceprofile
- title: Quality Control Plots
  description: |
    Functions to plots diverse QC visualizatios.
  contents:
  - plot_runsequence
  - plot_runscatter
  - plot_rla_boxplot
  - plot_pca
  - plot_pca_loading
  - plot_feature_correlations
  - plot_rt_vs_chain
  - plot_matrixeffects
  - plot_normalization_qc
  - plot_qcmetrics_comparison
  - plot_interference_correction
  - plot_qc_interference_impact
- title: Plot Defaults and Export
  description: |
    Set session-wide defaults (font size, point size, legend, strips, save units
    and resolution) for the plotting functions, and write figures to file at a
    defined size. See the "Customising plots" article.
  contents:
  - mrmhub_set_plot_defaults
  - mrmhub_get_plot_defaults
  - mrmhub_reset_plot_defaults
  - save_plot
- title: Response Curves
  description: |
    Functions to calculate and visualize response curves
  contents:
  - plot_responsecurves
  - get_response_curve_stats
- title: Data Reporting and Sharing
  description: |
    Functions to export processed and raw datasets and the processing steps in different formats.
  contents:
  - save_report_xlsx
  - save_dataset_rds
  - read_dataset_rds
  - save_dataset_csv
  - save_dataset_mztab
  - save_dataset_summarizedexperiment
  - save_feature_qc_metrics
- title: Lipidomics
  description: |
    Functions specific to lipidomics data processing and analysis.
  contents: parse_lipid_feature_names
- title: Datasets
  description: |
    Example datasets for testing and demonstration.
  contents:
  - lipidomics_dataset
  - quant_lcms_dataset
  - data_load_example
- title: Helper functions
  description: |
    A collection of functions that may be useful in the context of mass spectrometry is also available.
  contents:
  - cv
  - cv_log
  - pooled_sd
  - pooled_rsd
  - calc_average_molweight
  - correct_drift
  - fun_gauss.kernel.smooth
  - fun_loess
  - fun_cspline
  - fun_gam_smooth
  - get_mad_tails
  - get_iqr_tails
  - get_outlier_bounds
  - order_chained_columns_tbl
  - mrmhub_enable_cli_color
