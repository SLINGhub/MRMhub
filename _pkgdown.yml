url: https://slinghub.github.io/MRMhub/quant/
title: mrmhub  # navbar/tab = real package name; "MRMhub-QUANT" brand lives in page content
template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    # Shared MRMhub brand (pkgdown 2.2.0 cannot read _brand.yml, so the palette
    # is mirrored here from docs-site/_brand.yml + integrator/docs/_brand.yml).
    primary: "#5B8FA8"   # steel-blue accent: links, buttons
    dark: "#2d5c80"      # header/menu bar colour: drives the navbar via navbar.bg below
navbar:
  bg: dark    # header/menu bar, shared across all three sites
  type: dark  # light text on the dark navbar
  structure:
    left:
    - get_started
    - tutorials
    - manual
    - reference
    right:
    - help
    - news
    - mrmhub
    - integrator
    - search
    - github
    - lightswitch
  components:
    home: ~
    mrmhub:                       # link back to the landing hub (parity with INTEGRATOR)
      text: "← MRMhub home"
      href: https://slinghub.github.io/MRMhub/
    integrator:                   # cross-link to the INTEGRATOR manual (bidirectional with its QUANT link)
      text: "INTEGRATOR ↗"
      href: https://slinghub.github.io/MRMhub/integrator/
    get_started:
      text: Get Started
      menu:
      - text: MRMhub overview
        href: articles/manual-01-key-concepts.html
      - text: '-------'
      - text: Installation
        href: articles/manual-00-installation.html
      - text: Getting started with R and Quarto notebooks
        href: articles/tutorial-13-getting-started-r-quarto.html
      - text: Getting started with MRMhub
        href: articles/tutorial-02-getting-started-mrmhub.html
      - text: Using the workflow builder
        href: articles/tutorial-12-workflow-builder.html
    help:
      text: Help
      href: articles/manual-10-troubleshooting.html
    tutorials:
      text: Tutorials
      menu:
      - text: Example workflows
      - text: Lipidomics
        href: articles/tutorial-03-lipidomics-workflow.html
      - text: Quantitative assay with external calibration
        href: articles/tutorial-06-external-calibration.html
      - text: '-------'
      - text: Preparing and importing data
        href: articles/tutorial-01-prep-data.html
      - text: '-------'
      - text: Data processing
      - text: Correcting isotopic interference
        href: articles/tutorial-11-interference-correction.html
      - text: Drift and batch correction
        href: articles/tutorial-04-drift-correction.html
      - text: Calibration by a reference sample
        href: articles/tutorial-07-calibration-reference.html
      - text: '-------'
      - text: 'Exploring QC: RunScatter and PCA'
        href: articles/tutorial-05-run-scatter.html
      - text: Exporting results
        href: articles/tutorial-08-export-formats.html
    manual:
      text: Manual
      menu:
      - text: Manual (all pages)
        href: articles/manual-index.html
      - text: '-------'
      - text: Getting started
      - text: Installation
        href: articles/manual-00-installation.html
      - text: MRMhub overview
        href: articles/manual-01-key-concepts.html
      - text: '-------'
      - text: Preparing and running
      - text: Importing analytical data
        href: articles/manual-04-data-import.html
      - text: Metadata tables & matching
        href: articles/manual-05-metadata.html
      - text: Isotopic interference correction
        href: articles/manual-12-interference-correction.html
      - text: Drift and batch correction
        href: articles/manual-07-corrections.html
      - text: Quarto workflows
        href: articles/manual-11-quarto-workflows.html
      - text: '-------'
      - text: Visualisation functions
        href: articles/manual-08-visualization.html
      - text: '-------'
      - text: Reference
      - text: The MRMhubExperiment data object
        href: articles/manual-02-data-object.html
      - text: Function map
        href: articles/manual-13-function-map.html
      - text: Glossary
        href: articles/manual-14-glossary.html
      - text: Design decisions
        href: articles/manual-03-design-decisions.html
      - text: Sample types & QC roles
        href: articles/manual-06-sample-types.html
      - text: Getting help from an AI assistant
        href: articles/manual-09-ai-assistants.html
      - text: Troubleshooting & FAQ
        href: articles/manual-10-troubleshooting.html
    news:
      text: NEWS
      href: news/index.html
redirects:
  # Slug renames + consolidations — keep old published URLs alive (meta-refresh stubs).
  - ["articles/manual-00-get-started.html", "articles/manual-00-installation.html"]
  - ["articles/manual-00-architecture.html", "articles/manual-03-design-decisions.html"]
  # renamed pages
  - ["articles/manual-00-key-concepts.html", "articles/manual-01-key-concepts.html"]
  - ["articles/manual-10-design-decisions.html", "articles/manual-03-design-decisions.html"]
  - ["articles/manual-06-metadata-import.html", "articles/manual-05-metadata.html"]
  - ["articles/manual-00-sample-types.html", "articles/manual-06-sample-types.html"]
  - ["articles/manual-07-drift-batch-correction.html", "articles/manual-07-corrections.html"]
  - ["articles/manual-09-troubleshooting.html", "articles/manual-10-troubleshooting.html"]
  # data-model 4 -> data-object
  - ["articles/manual-01-data-structure.html", "articles/manual-02-data-object.html"]
  - ["articles/manual-02-data-identifiers.html", "articles/manual-02-data-object.html"]
  - ["articles/manual-03-feature-variables.html", "articles/manual-02-data-object.html"]
  - ["articles/manual-04-mrmhub-experiment.html", "articles/manual-02-data-object.html"]
