  - ["articles/manual-00-design-overview.html", "articles/manual-03-design-decisions.html"]
  - ["articles/manual-00-integrator-vs-quant.html", "articles/manual-03-design-decisions.html"]
  - ["articles/manual-11-cheatsheet.html", "articles/manual-01-key-concepts.html"]
  # plot-customization folded into visualisation
  - ["articles/manual-13-plot-customization.html", "articles/manual-08-visualization.html"]
  # drift + batch tutorials merged into tutorial-04-drift-correction
  - ["articles/tutorial-06-batch-correction.html", "articles/tutorial-04-drift-correction.html"]
