  - ["articles/manual-05-data-import.html", "articles/manual-04-data-import.html"]
  - ["articles/manual-05a-which-importer.html", "articles/manual-04-data-import.html"]
  - ["articles/manual-05b-data-file-structures.html", "articles/manual-04-data-import.html"]
