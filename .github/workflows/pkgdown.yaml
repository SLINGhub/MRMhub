# .github/workflows/pkgdown.yml
name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      # Needed for deploying to GitHub Pages
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:

      # 1️⃣ Checkout the repository
      - uses: actions/checkout@v4

      # 2️⃣ Install Pandoc (required for R Markdown / Quarto rendering)
      - uses: r-lib/actions/setup-pandoc@v2

      # 3️⃣ Install R
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 4️⃣ Install package dependencies with pak
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Run this inside your subfolder package
          working-directory: quant
          # Install pkgdown and your local package
          extra-packages: any::pkgdown, local::.
          # Only install Imports + LinkingTo (skip Suggests like lancer)
          dependencies: Imports

      # 5️⃣ Install Quarto
      # Needed to render any .qmd articles in your package
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 6️⃣ Build the pkgdown site
      - name: Build site
        working-directory: quant
        run: pkgdown::build_site_github_pages(
          new_process = FALSE,   # run in current R process
          install = FALSE        # do not reinstall package
        )
        shell: Rscript {0}

      # 7️⃣ Deploy the site to GitHub Pages
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages          # deploy to gh-pages branch
          folder: quant/docs        # deploy from the pkgdown docs folder
