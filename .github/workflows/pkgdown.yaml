# .github/workflows/pkgdown.yml
name: pkgdown

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ['integrator/**', 'docs-site/**']
  pull_request:
    paths-ignore: ['integrator/**', 'docs-site/**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      # Install dependencies directly with base R
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::remotes
            any::pkgdown
            any::quarto
            any::carrier
            any::mirai
            any::gt
            any::DT

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Install mrmhub
        # force = TRUE: install_local() otherwise compares the source version
        # against the cached library and skips the install whenever Version: is
        # unchanged, so articles render against a stale build.
        run: Rscript -e 'remotes::install_local(dependencies = FALSE, force = TRUE)'

      - name: Build pkgdown site
        run: Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      - name: Deploy to GitHub Pages 🚀
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/develop'
        uses: JamesIves/github-pages-deploy-action@65b5dfd4f5bcd3a7403bbc2959c144256167464e # v4.5.0
        with:
          # QUANT pkgdown site lives under the /quant/ subpath (matches
          # `url:` in _pkgdown.yml). The Quarto docs-site/ owns the Pages
          # root. target-folder scopes `clean` to quant/ only, so this
          # deploy refreshes the QUANT subsite without touching the root
          # landing page / INTEGRATOR site published by quarto.yaml.
          clean: true
          branch: gh-pages
          folder: docs
          target-folder: quant
