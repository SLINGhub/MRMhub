# .github/workflows/pkgdown.yml
name: pkgdown

on:
  push:
    branches: [main, master, development]
    paths-ignore: ['integrator/**', 'docs-site/**']
  pull_request:
    paths-ignore: ['integrator/**', 'docs-site/**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install dependencies directly with base R
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::pkgdown
            any::quarto
            any::carrier
            any::mirai
            any::gt
            any::DT

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install mrmhub
        # force = TRUE: install_local() otherwise compares the source version
        # against the cached library and skips the install whenever Version: is
        # unchanged, so articles render against a stale build.
        run: Rscript -e 'remotes::install_local(dependencies = FALSE, force = TRUE)'

      - name: Build pkgdown site
        run: Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      - name: Deploy to GitHub Pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # QUANT pkgdown site lives under the /quant/ subpath (matches
          # `url:` in _pkgdown.yml). The Quarto docs-site/ owns the Pages
          # root. target-folder scopes `clean` to quant/ only, so this
          # deploy refreshes the QUANT subsite without touching the root
          # landing page / INTEGRATOR site published by quarto.yaml.
          clean: true
          branch: gh-pages
          folder: docs
          target-folder: quant
