# .github/workflows/pkgdown.yml
name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:

      # 1️⃣ Checkout the repository
      - uses: actions/checkout@v4

      # 2️⃣ Install Pandoc (required for R Markdown / Quarto rendering)
      - uses: r-lib/actions/setup-pandoc@v2

      # 3️⃣ Install R
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 4️⃣ Install R package dependencies with pak, skipping Suggests
      - name: Install dependencies with pak
        working-directory: quant
        run: |
          Rscript -e 'install.packages("pak"); pak::pkg_install(c("pkgdown", "quarto", "carrier", "mirai", "local::."), dependencies = c("Imports", "LinkingTo", "Suggests"))'
      # 5️⃣ Install Quarto (needed to render .qmd articles)
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 6️⃣ Build the pkgdown site
      - name: Build site
        working-directory: quant
        run: Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      # 7️⃣ Deploy the site to GitHub Pages
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages          # deploy to gh-pages branch
          folder: quant/docs        # deploy from the pkgdown docs folder
