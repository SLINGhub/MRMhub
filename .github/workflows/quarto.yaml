# .github/workflows/quarto.yml
# Builds the two Quarto sites and publishes them to the gh-pages branch:
#   - docs-site/      -> ROOT  https://slinghub.github.io/MRMhub/        (landing page)
#   - integrator/docs -> /integrator/  https://slinghub.github.io/MRMhub/integrator/  (INTEGRATOR manual)
# The QUANT pkgdown site is published separately to /quant/ by pkgdown.yaml.
name: quarto

on:
  push:
    branches: [main, master, development]
    paths:
      - 'docs-site/**'
      - 'integrator/docs/**'
      - '.github/workflows/quarto.yaml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'integrator/docs/**'
      - '.github/workflows/quarto.yaml'
  workflow_dispatch:

jobs:
  quarto:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render landing page
        run: quarto render docs-site

      - name: Render INTEGRATOR site
        run: quarto render integrator/docs

      # GitHub Pages serves with Jekyll by default, which drops files/dirs
      # whose names start with "_". A .nojekyll marker disables that.
      - name: Add .nojekyll markers
        run: |
          touch docs-site/_site/.nojekyll
          touch integrator/docs/_site/.nojekyll

      # Landing page owns the Pages root. clean: true removes stale root
      # files, but clean-exclude protects the QUANT (pkgdown) and INTEGRATOR
      # (Quarto) subsites that live in their own subfolders.
      - name: Deploy landing page (root) 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          clean-exclude: |
            quant
            integrator
          branch: gh-pages
          folder: docs-site/_site

      # INTEGRATOR manual lives under /integrator/. target-folder scopes
      # clean to that subfolder, so this never touches the root or /quant/.
      - name: Deploy INTEGRATOR site (/integrator/) 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: integrator/docs/_site
          target-folder: integrator
