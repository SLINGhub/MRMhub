name: integrator-release

# Build the Rust INTEGRATOR executable and the mrmhub-viz viewer for macOS /
# Windows / Linux, package them (binaries + MRMhub_plot.r + example inputs), and
# attach the archives to a GitHub Release: a plain package and, when
# vars.DEMO_DATA_URL is set, a demo package (plus demo raw data, the QUANT demo
# and Get-started.html). A release also gets the mrmhub R source package. macOS
# builds are code-signed + notarized when the signing secrets are present, and
# fall back to an ad-hoc signature otherwise.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: ['**']   # branch pushes only; tag pushes are covered by the release event
    paths:
      - 'integrator/Cargo.toml'
      - 'integrator/Cargo.lock'
      - 'integrator/src/**'
      - 'integrator/build.rs'
      - 'integrator/example/**'
      - 'integrator/demo/**'
      - 'integrator/MRMhub_plot.r'
      - 'integrator_viz/**'
      - 'docs-site/get-started.qmd'
      - '.github/workflows/integrator-release.yml'

permissions:
  contents: write

jobs:
  # Instructions bundled with the demo, rendered from the web page's source so the
  # two cannot drift. Rendered outside the website project (no navbar chrome).
  get-started:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render Get-started.html
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/get-started"; mkdir -p "$tmp"
          cp docs-site/get-started.qmd docs-site/_brand.yml "$tmp/"
          cd "$tmp"
          quarto render get-started.qmd --to html -M embed-resources:true -M toc:true -o Get-started.html
      - uses: actions/upload-artifact@v6
        with:
          name: get-started
          path: ${{ runner.temp }}/get-started/Get-started.html

  build:
    needs: get-started
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      DEMO_DATA_URL: ${{ vars.DEMO_DATA_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build INTEGRATOR
        working-directory: integrator
        run: cargo build --release --locked --target ${{ matrix.target }}

      # --- mrmhub-viz (Tauri; static frontend, no installer bundle) ------------
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev build-essential

      - name: Build mrmhub-viz
        working-directory: integrator_viz
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npx tauri build --no-bundle --target ${{ matrix.target }}

      - name: Resolve version and names
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"; v="${v#v}"
          else
            v="$(grep -m1 '^version' integrator/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          echo "version=$v"                                >> "$GITHUB_OUTPUT"
          echo "ext=$ext"                                  >> "$GITHUB_OUTPUT"
          echo "pkg=MRMhub-$v-${{ matrix.target }}"        >> "$GITHUB_OUTPUT"
          echo "demo=MRMhub-demo-$v-${{ matrix.target }}"  >> "$GITHUB_OUTPUT"

      - name: Stage binary package
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ steps.vars.outputs.pkg }}"; ext="${{ steps.vars.outputs.ext }}"
          mkdir -p "dist/$pkg" out
          cp "integrator/target/${{ matrix.target }}/release/MRMhub$ext" "dist/$pkg/"
          cp "integrator_viz/src-tauri/target/${{ matrix.target }}/release/mrmhub-viz$ext" "dist/$pkg/"
          cp integrator/MRMhub_plot.r "dist/$pkg/"
          cp -R integrator/example/. "dist/$pkg/"

      # --- macOS signing --------------------------------------------------------
      - name: Detect signing secrets
        id: sign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "have_signing=true"  >> "$GITHUB_OUTPUT"
          else
            echo "have_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets absent — using an ad-hoc signature. Users must clear Gatekeeper manually."
          fi

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && steps.sign.outputs.have_signing == 'true'
        env:
          CERT_P12_BASE64:   ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD:     ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain-db"
          cert="$RUNNER_TEMP/cert.p12"
          echo "$CERT_P12_BASE64" | base64 -D -o "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security import "$cert" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$cert"

      - name: Codesign binaries
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          for bin in "dist/${{ steps.vars.outputs.pkg }}/MRMhub" "dist/${{ steps.vars.outputs.pkg }}/mrmhub-viz"; do
            if [ "${{ steps.sign.outputs.have_signing }}" = "true" ]; then
              codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$bin"
              codesign --verify --strict --verbose=2 "$bin"
            else
              codesign --force --sign - "$bin"
            fi
          done

      - name: Notarize
        if: runner.os == 'macOS' && steps.sign.outputs.have_signing == 'true'
        env:
          ASC_KEY_ID:        ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:     ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          p8="$RUNNER_TEMP/asc.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -D -o "$p8"
          zip="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "dist/${{ steps.vars.outputs.pkg }}" "$zip"
          xcrun notarytool submit "$zip" --key "$p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          rm -f "$p8"
          # A bare Mach-O in a .zip cannot be stapled; Gatekeeper checks notarization online at first launch.

      # --- demo package (binary package + demo files + raw data) ----------------
      - name: Download Get-started.html
        if: env.DEMO_DATA_URL != ''
        uses: actions/download-artifact@v5
        with:
          name: get-started
          path: ${{ runner.temp }}/get-started

      - name: Stage demo package
        if: env.DEMO_DATA_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ steps.vars.outputs.pkg }}"; demo="${{ steps.vars.outputs.demo }}"
          cp -R "dist/$pkg" "dist/$demo"
          cp -R integrator/demo/. "dist/$demo/"
          cp "$RUNNER_TEMP/get-started/Get-started.html" "dist/$demo/"
          curl -fSL "$DEMO_DATA_URL" -o "$RUNNER_TEMP/demo-data.zip"
          unzip -q "$RUNNER_TEMP/demo-data.zip" -d "dist/$demo"
          test -d "dist/$demo/mzML" && test -f "dist/$demo/QUANT/data/long.csv"

      # --- zip (ditto on unix, Compress-Archive on Windows) ---------------------
      - name: Zip packages (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/${{ steps.vars.outputs.pkg }}"  "out/${{ steps.vars.outputs.pkg }}.zip" 2>/dev/null \
            || (cd dist && zip -r -q "../out/${{ steps.vars.outputs.pkg }}.zip" "${{ steps.vars.outputs.pkg }}")
          if [ -d "dist/${{ steps.vars.outputs.demo }}" ]; then
            ditto -c -k --keepParent "dist/${{ steps.vars.outputs.demo }}" "out/${{ steps.vars.outputs.demo }}.zip" 2>/dev/null \
              || (cd dist && zip -r -q "../out/${{ steps.vars.outputs.demo }}.zip" "${{ steps.vars.outputs.demo }}")
          fi

      - name: Zip packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ steps.vars.outputs.pkg }}" -DestinationPath "out/${{ steps.vars.outputs.pkg }}.zip"
          if (Test-Path "dist/${{ steps.vars.outputs.demo }}") {
            Compress-Archive -Path "dist/${{ steps.vars.outputs.demo }}" -DestinationPath "out/${{ steps.vars.outputs.demo }}.zip"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.vars.outputs.pkg }}
          path: out/*.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          fail_on_unmatched_files: true

  # mrmhub R source package, attached to the same release.
  r-tarball:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check DESCRIPTION version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          v="$(grep -m1 '^Version:' DESCRIPTION | sed -E 's/^Version: *//')"
          tag="${{ github.event.release.tag_name }}"
          if [ "$v" != "${tag#v}" ]; then
            echo "::error::DESCRIPTION Version $v does not match release tag $tag"
            exit 1
          fi

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::carrier

      - name: Build source package
        run: R CMD build .

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: mrmhub_*.tar.gz
          fail_on_unmatched_files: true
