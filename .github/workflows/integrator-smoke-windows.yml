name: integrator-smoke-windows

# Smoke test of a published release on Windows: download its demo package, run
# INTEGRATOR steps 1-3 and check that every run and transition was integrated.
# Read-only on the release; long.csv is kept as an artifact for comparison.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v1.0.0)
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the Windows demo package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "MRMhub-demo-*-x86_64-pc-windows-msvc.zip" -D dl

      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem dl/*.zip).FullName -DestinationPath demo

      - name: Run INTEGRATOR steps 1-3 and check the results
        shell: bash
        run: |
          set -euo pipefail
          cd demo/MRMhub-demo-*
          for s in 1 2 3; do ./MRMhub.exe "$s"; done
          # Validation reports must be empty (missing_files.txt may hold a blank line).
          [ -z "$(tr -d '[:space:]' < missing_files.txt)" ]
          [ ! -s missing_compounds.txt ]
          [ "$(wc -l < ambiguous_assignment.csv)" -le 1 ]
          # Count non-empty lines: the input CSVs may lack a final newline.
          runs=$(( $(grep -c . run_order.csv) - 1 ))
          transitions=$(( $(grep -c . feature_list.csv) - 1 ))
          rows=$(( $(grep -c . long.csv) - 1 ))
          echo "runs=$runs transitions=$transitions long.csv rows=$rows"
          [ "$rows" -eq $(( runs * transitions )) ]

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: long-windows-${{ inputs.tag }}
          path: demo/*/long.csv
