name: R-CMD-check

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RUN_VDIFFR: ${{ matrix.config.os == 'macos-latest' && 'true' || 'false' }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      # ----------------------------------------------------------------
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Setup Pandoc (required for R Markdown / Quarto)
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # ----------------------------------------------------------------
      # Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      # ----------------------------------------------------------------
      # Install package dependencies
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ./quant
          extra-packages: |
            any::rcmdcheck
            any::carrier

      # ----------------------------------------------------------------
      # Render Quarto vignettes (optional)
      - name: Render Quarto vignettes
        if: matrix.config.os == 'macos-latest'
        run: |
          R -e 'if (requireNamespace("quarto", quietly = TRUE)) quarto::quarto_render(input = "vignettes/articles", execute_params = list(), quiet = FALSE)'

      # ----------------------------------------------------------------
      # Run R CMD check
      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: ./quant
          build_args: 'c("--no-manual")'
          upload-snapshots: ${{ env.RUN_VDIFFR }}

      # ----------------------------------------------------------------
      # Upload check results if failed
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: quant/check

      # ----------------------------------------------------------------
      # Upload vdiffr snapshots (macOS only)
      - name: Upload vdiffr snapshots
        if: ${{ env.RUN_VDIFFR == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-snapshots
          path: quant/tests/figs
