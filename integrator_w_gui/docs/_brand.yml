# (website.navbar.background); `primary` drives links / buttons. Keep in sync
# with docs-site/_brand.yml and _pkgdown.yml (QUANT).
meta:
  name: MRMhub-INTEGRATOR
  link: https://slinghub.github.io/MRMhub/integrator/

color:
  palette:
    steel-blue: "#5B8FA8"
    navy: "#2C3E50"
  primary: steel-blue
